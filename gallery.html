<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Çalışmalar — Ekin Yetkin</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #050505;
            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            padding: 32px 5vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        .back {
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #999;
            transition: color .25s ease;
        }

        .back:hover {
            color: #fff;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            padding: 100px 5vw 70px;
            border-bottom: 1px solid #222;
        }

        .eyebrow {
            font-size: 11px;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: #777;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(50px, 9vw, 150px);
            line-height: .88;
            letter-spacing: -.055em;
            font-weight: 700;
            max-width: 1100px;
        }

        /* =========================
           GALLERY
        ========================= */

        .gallery {
            padding: 60px 5vw 100px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            background: #111;
            min-height: 350px;
        }

        .gallery-item img,
        .gallery-item video {
            width: 100%;
            height: 100%;
            min-height: 350px;
            display: block;
            object-fit: cover;
            transition:
                transform .5s ease,
                opacity .3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.025);
        }

        .gallery-item:hover video {
            transform: scale(1.025);
        }

        .video-item {
            cursor: default;
        }

        .video-item video {
            cursor: pointer;
        }

        /* =========================
           FULLSCREEN VIDEO
        ========================= */

        .video-item video:fullscreen {
            width: 100%;
            height: 100%;
            min-height: 0;
            object-fit: contain !important;
            transform: none !important;
            background: #000;
        }

        .video-item video:-webkit-full-screen {
            width: 100%;
            height: 100%;
            min-height: 0;
            object-fit: contain !important;
            transform: none !important;
            background: #000;
        }

        .video-item video:-moz-full-screen {
            width: 100%;
            height: 100%;
            min-height: 0;
            object-fit: contain !important;
            transform: none !important;
            background: #000;
        }

        /* =========================
           LIGHTBOX
        ========================= */

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .96);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 30px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 95vw;
            max-height: 92vh;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 25px;
            right: 30px;
            font-size: 35px;
            line-height: 1;
            color: #fff;
            cursor: pointer;
            font-weight: 300;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            min-height: 300px;
            padding: 100px 5vw;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-size: 13px;
            letter-spacing: .08em;
            text-transform: uppercase;
            text-align: center;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            header {
                padding: 25px 5vw;
            }

            .hero {
                padding: 70px 5vw 50px;
            }

            h1 {
                font-size: clamp(45px, 14vw, 90px);
            }

            .gallery {
                padding: 35px 5vw 70px;
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .gallery-item {
                min-height: 300px;
            }

            .gallery-item img,
            .gallery-item video {
                min-height: 300px;
            }

            .lightbox {
                padding: 15px;
            }

            .lightbox-close {
                top: 15px;
                right: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html" class="logo">
            EKİN YETKİN
        </a>

        <a href="index.html" class="back">
            ← Geri
        </a>
    </header>

    <section class="hero">
        <div class="eyebrow" id="categoryLabel">
            ÇALIŞMALAR
        </div>

        <h1 id="categoryTitle">
            YÜKLENİYOR...
        </h1>
    </section>

    <main>
        <div class="status" id="status">
            ÇALIŞMALAR YÜKLENİYOR...
        </div>

        <section class="gallery" id="gallery"></section>
    </main>

    <!-- LIGHTBOX -->

    <div class="lightbox" id="lightbox">
        <div class="lightbox-close" id="lightboxClose">
            ×
        </div>

        <img id="lightboxImage" src="" alt="">
    </div>

    <script>

        /* =========================
           AYARLAR
        ========================= */

        const repoOwner = "ekinyetkin";
        const repoName = "ekinyetkin.github.io";
        const branch = "main";

        const categories = {

            "urun-yemek": {
                title: "ÜRÜN & YEMEK",
                label: "ÇALIŞMALAR"
            },

            "marka-tanitim": {
                title: "MARKA & TANITIM",
                label: "ÇALIŞMALAR"
            },

            "etkinlik": {
                title: "ETKİNLİK",
                label: "ÇALIŞMALAR"
            },

            "roportaj": {
                title: "RÖPORTAJ",
                label: "ÇALIŞMALAR"
            },

            "dugun-nikah": {
                title: "DÜĞÜN & NİKAH",
                label: "ÇALIŞMALAR"
            },

            "sosyal-medya": {
                title: "SOSYAL MEDYA",
                label: "ÇALIŞMALAR"
            }

        };


        /* =========================
           CATEGORY
        ========================= */

        const params = new URLSearchParams(window.location.search);

        const category = params.get("category");

        const categoryData = categories[category];

        const categoryTitle =
            document.getElementById("categoryTitle");

        const categoryLabel =
            document.getElementById("categoryLabel");

        const gallery =
            document.getElementById("gallery");

        const status =
            document.getElementById("status");


        if (!categoryData) {

            categoryLabel.textContent = "HATA";

            categoryTitle.textContent = "KATEGORİ BULUNAMADI";

            status.textContent =
                "Geçerli bir kategori seçilmedi.";

        } else {

            categoryLabel.textContent =
                categoryData.label;

            categoryTitle.textContent =
                categoryData.title;

            loadGallery(category);

        }


        /* =========================
           DOSYA UZANTILARI
        ========================= */

        const imageExtensions = [
            "jpg",
            "jpeg",
            "png",
            "webp",
            "gif"
        ];

        const videoExtensions = [
            "mp4",
            "webm",
            "mov"
        ];


        /* =========================
           GITHUB API
        ========================= */

        async function loadGallery(category) {

            const apiUrl =
                `https://api.github.com/repos/${repoOwner}/${repoName}/contents/images/${category}?ref=${branch}`;

            try {

                const response =
                    await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error("GitHub API hatası");
                }

                const files =
                    await response.json();

                const mediaFiles =
                    files.filter(file => {

                        if (file.type !== "file") {
                            return false;
                        }

                        const extension =
                            getExtension(file.name);

                        return (
                            imageExtensions.includes(extension) ||
                            videoExtensions.includes(extension)
                        );

                    });


                /* =========================
                   DOSYA SIRALAMA
                ========================= */

                mediaFiles.sort((a, b) => {

                    return naturalSort(
                        a.name,
                        b.name
                    );

                });


                gallery.innerHTML = "";

                if (mediaFiles.length === 0) {

                    status.textContent =
                        "Bu kategoride henüz çalışma bulunmuyor.";

                    return;

                }


                status.style.display = "none";

                mediaFiles.forEach(file => {

                    const extension =
                        getExtension(file.name);

                    if (
                        imageExtensions.includes(extension)
                    ) {

                        createImage(file);

                    } else if (
                        videoExtensions.includes(extension)
                    ) {

                        createVideo(file);

                    }

                });

            }

            catch (error) {

                console.error(error);

                status.textContent =
                    "Çalışmalar yüklenirken bir hata oluştu.";

            }

        }


        /* =========================
           EXTENSION
        ========================= */

        function getExtension(filename) {

            return filename
                .split(".")
                .pop()
                .toLowerCase();

        }


        /* =========================
           RAW URL
        ========================= */

        function getRawUrl(path) {

            return `https://raw.githubusercontent.com/${repoOwner}/${repoName}/${branch}/${path}`;

        }


        /* =========================
           IMAGE
        ========================= */

        function createImage(file) {

            const item =
                document.createElement("div");

            item.className =
                "gallery-item";


            const image =
                document.createElement("img");

            image.src =
                getRawUrl(file.path);

            image.alt =
                file.name;

            image.loading =
                "lazy";


            image.addEventListener(
                "click",
                () => {

                    openLightbox(
                        image.src,
                        image.alt
                    );

                }
            );


            item.appendChild(image);

            gallery.appendChild(item);

        }


        /* =========================
           VIDEO
        ========================= */

        function createVideo(file) {

            const item =
                document.createElement("div");

            item.className =
                "gallery-item video-item";


            const video =
                document.createElement("video");

            video.src =
                getRawUrl(file.path);

            video.controls =
                true;

            video.preload =
                "metadata";

            video.playsInline =
                true;


            item.appendChild(video);

            gallery.appendChild(item);

        }


        /* =========================
           LIGHTBOX
        ========================= */

        const lightbox =
            document.getElementById("lightbox");

        const lightboxImage =
            document.getElementById("lightboxImage");

        const lightboxClose =
            document.getElementById("lightboxClose");


        function openLightbox(src, alt) {

            lightboxImage.src =
                src;

            lightboxImage.alt =
                alt;

            lightbox.classList.add("active");

            document.body.style.overflow =
                "hidden";

        }


        function closeLightbox() {

            lightbox.classList.remove("active");

            lightboxImage.src =
                "";

            document.body.style.overflow =
                "";

        }


        lightboxClose.addEventListener(
            "click",
            closeLightbox
        );


        lightbox.addEventListener(
            "click",
            event => {

                if (
                    event.target === lightbox
                ) {

                    closeLightbox();

                }

            }
        );


        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    closeLightbox();

                }

            }
        );


        /* =========================
           NATURAL SORT
        ========================= */

        function naturalSort(a, b) {

            return a.localeCompare(
                b,
                undefined,
                {
                    numeric: true,
                    sensitivity: "base"
                }
            );

        }

    </script>

</body>
</html>
