<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ekin Yetkin — Çalışmalar</title>

    <meta
        name="description"
        content="Ekin Yetkin — Görsel içerik çalışmaları."
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #050505;
            color: #f2f2f2;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 78px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 5vw;

            background: rgba(5, 5, 5, .88);
            backdrop-filter: blur(12px);

            border-bottom: 1px solid #202020;

            z-index: 1000;
        }

        .logo {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .back {
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #888;
            transition: color .2s ease;
        }

        .back:hover {
            color: #fff;
        }

        main {
            padding: 160px 5vw 100px;
        }

        .category-label {
            font-size: 11px;
            letter-spacing: 3px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(55px, 9vw, 130px);
            line-height: .85;
            letter-spacing: -6px;
            text-transform: uppercase;
            margin-bottom: 80px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2px;
            background: #202020;
        }

        .gallery-item {
            position: relative;
            background: #080808;
            overflow: hidden;
        }

        /* FOTOĞRAFLAR */

        .gallery-item > img {
            width: 100%;
            height: 100%;
            min-height: 350px;
            display: block;
            object-fit: cover;

            transition:
                transform .5s ease,
                opacity .3s ease;

            cursor: pointer;
        }

        .gallery-item:hover > img {
            transform: scale(1.025);
        }

        /* VİDEO */

        .video-item {
            position: relative;
            overflow: hidden;
            background: #000;
        }

        .video-player {
            position: relative;
            width: 100%;
            min-height: 350px;
            overflow: hidden;
            background: #000;
        }

        .video-player video {
            width: 100%;
            height: 100%;
            min-height: 350px;

            display: block;

            object-fit: cover;

            transition:
                transform .5s ease,
                opacity .3s ease;

            cursor: pointer;
        }

        .video-player:hover video {
            transform: scale(1.025);
        }

        /* BÜYÜK OYNATMA TUŞU */

        .video-play-overlay {
            position: absolute;

            top: 50%;
            left: 50%;

            width: 76px;
            height: 76px;

            transform: translate(-50%, -50%);

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid rgba(255,255,255,.75);
            border-radius: 50%;

            background: rgba(0,0,0,.45);
            backdrop-filter: blur(5px);

            color: #fff;

            cursor: pointer;

            z-index: 10;

            transition:
                opacity .25s ease,
                transform .25s ease,
                background .25s ease,
                border-color .25s ease;
        }

        .video-play-overlay:hover {
            background: rgba(255,255,255,.15);
            border-color: #fff;

            transform:
                translate(-50%, -50%)
                scale(1.08);
        }

        .video-play-icon {
            width: 0;
            height: 0;

            margin-left: 5px;

            border-top: 11px solid transparent;
            border-bottom: 11px solid transparent;
            border-left: 17px solid #fff;
        }

        .video-player.playing .video-play-overlay {
            opacity: 0;
            pointer-events: none;
        }

        /* VİDEO ETİKETİ */

        .video-label {
            position: absolute;
            top: 18px;
            left: 18px;

            font-size: 10px;
            letter-spacing: 2px;

            padding: 7px 10px;

            background: rgba(0,0,0,.65);

            text-transform: uppercase;

            pointer-events: none;

            z-index: 16;
        }

        /* VİDEO KONTROLLERİ */

        .video-controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;

            display: flex;
            align-items: center;
            gap: 10px;

            padding: 12px 14px;

            background: linear-gradient(
                to top,
                rgba(0,0,0,.85),
                rgba(0,0,0,.45),
                transparent
            );

            opacity: 0;
            transform: translateY(5px);

            transition:
                opacity .25s ease,
                transform .25s ease;

            z-index: 15;
        }

        .video-player:hover .video-controls,
        .video-player.playing .video-controls,
        .video-player:focus-within .video-controls {
            opacity: 1;
            transform: translateY(0);
        }

        .video-button {
            width: 34px;
            height: 34px;

            border: 0;
            background: rgba(0,0,0,.55);
            color: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            font-size: 15px;
            line-height: 1;

            border-radius: 2px;

            transition:
                background .2s ease,
                transform .2s ease;
        }

        .video-button:hover {
            background: rgba(255,255,255,.18);
        }

        .video-button:active {
            transform: scale(.94);
        }

        .video-progress {
            flex: 1;
            height: 4px;

            appearance: none;
            -webkit-appearance: none;

            background: rgba(255,255,255,.3);

            cursor: pointer;

            border-radius: 10px;
        }

        .video-progress::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;

            width: 12px;
            height: 12px;

            background: #fff;
            border-radius: 50%;

            cursor: pointer;
        }

        .video-progress::-moz-range-thumb {
            width: 12px;
            height: 12px;

            background: #fff;
            border: 0;
            border-radius: 50%;

            cursor: pointer;
        }

        .video-time {
            min-width: 78px;

            color: #ddd;

            font-size: 10px;
            letter-spacing: .5px;

            text-align: center;
            white-space: nowrap;
        }

        /* TAM EKRAN */

        .video-player:fullscreen {
            width: 100vw;
            height: 100vh;

            min-height: 0;

            background: #000;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-player:fullscreen video {
            width: 100%;
            height: 100%;

            min-height: 0;

            object-fit: contain;

            transform: none !important;
        }

        .video-player:-webkit-full-screen {
            width: 100vw;
            height: 100vh;

            min-height: 0;

            background: #000;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-player:-webkit-full-screen video {
            width: 100%;
            height: 100%;

            min-height: 0;

            object-fit: contain;

            transform: none !important;
        }

        .video-player:fullscreen .video-controls,
        .video-player:-webkit-full-screen .video-controls {
            opacity: 1;
            transform: translateY(0);
        }

        /* DURUM MESAJLARI */

        .loading,
        .empty,
        .error {
            color: #666;
            font-size: 14px;
            line-height: 1.7;
            padding: 80px 0;
        }

        .error {
            color: #777;
        }

        /* LIGHTBOX */

        .lightbox {
            position: fixed;
            inset: 0;

            background: rgba(0,0,0,.94);

            display: none;
            align-items: center;
            justify-content: center;

            padding: 40px;

            z-index: 3000;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 94vw;
            max-height: 90vh;

            object-fit: contain;
        }

        .lightbox-close {
            position: fixed;
            top: 25px;
            right: 30px;

            font-size: 32px;
            font-weight: 300;

            color: #aaa;

            cursor: pointer;

            transition: color .2s ease;

            z-index: 3001;
        }

        .lightbox-close:hover {
            color: #fff;
        }

        /* MOBİL */

        @media (max-width: 800px) {

            nav {
                height: 68px;
                padding: 0 6vw;
            }

            main {
                padding: 125px 6vw 70px;
            }

            h1 {
                font-size: 14vw;
                letter-spacing: -4px;
                margin-bottom: 50px;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery-item > img {
                min-height: 280px;
            }

            .video-player {
                min-height: 280px;
            }

            .video-player video {
                min-height: 280px;
            }

            .video-play-overlay {
                width: 64px;
                height: 64px;
            }

            .video-play-icon {
                border-top-width: 9px;
                border-bottom-width: 9px;
                border-left-width: 14px;
            }

            .video-controls {
                opacity: 1;
                transform: none;

                padding: 10px;
                gap: 7px;
            }

            .video-button {
                width: 32px;
                height: 32px;
            }

            .video-time {
                min-width: 65px;
                font-size: 9px;
            }

            .lightbox {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <nav>

        <a href="index.html" class="logo">
            EKİN YETKİN
        </a>

        <a href="index.html#work" class="back">
            ← Çalışmalar
        </a>

    </nav>


    <main>

        <div
            class="category-label"
            id="categoryLabel"
        >
            Çalışmalar
        </div>

        <h1 id="categoryTitle">
            Yükleniyor
        </h1>

        <div
            id="gallery"
            class="gallery"
        >

            <div class="loading">
                Çalışmalar yükleniyor...
            </div>

        </div>

    </main>


    <!-- LIGHTBOX -->

    <div
        id="lightbox"
        class="lightbox"
    >

        <div
            id="lightboxClose"
            class="lightbox-close"
        >
            ×
        </div>

        <img
            id="lightboxImage"
            src=""
            alt=""
        >

    </div>


    <script>

        const GITHUB_USER = "ekinyetkin";
        const GITHUB_REPO = "ekinyetkin.github.io";
        const GITHUB_BRANCH = "main";


        const categories = {

            "urun-yemek": {
                title: "Ürün & Yemek",
                label: "Ürün & Yemek"
            },

            "marka-tanitim": {
                title: "Marka & Tanıtım",
                label: "Marka & Tanıtım"
            },

            "etkinlik": {
                title: "Etkinlik",
                label: "Etkinlik"
            },

            "roportaj": {
                title: "Röportaj",
                label: "Röportaj"
            },

            "dugun-nikah": {
                title: "Düğün & Nikah",
                label: "Düğün & Nikah"
            },

            "sosyal-medya": {
                title: "Sosyal Medya",
                label: "Sosyal Medya"
            }

        };


        const imageExtensions = [
            "jpg",
            "jpeg",
            "png",
            "webp",
            "gif"
        ];


        const videoExtensions = [
            "mp4",
            "webm",
            "mov"
        ];


        const params =
            new URLSearchParams(
                window.location.search
            );


        const category =
            params.get("category");


        if (!categories[category]) {

            document.title =
                "Ekin Yetkin — Çalışmalar";

            document.getElementById(
                "categoryTitle"
            ).textContent =
                "Kategori bulunamadı";

            document.getElementById(
                "categoryLabel"
            ).textContent =
                "Hata";

        } else {

            const categoryData =
                categories[category];

            document.title =
                "Ekin Yetkin — " +
                categoryData.title;

            document.getElementById(
                "categoryTitle"
            ).textContent =
                categoryData.title;

            document.getElementById(
                "categoryLabel"
            ).textContent =
                categoryData.label;

            loadGallery(category);

        }


        async function loadGallery(category) {

            const gallery =
                document.getElementById(
                    "gallery"
                );


            const apiUrl =
                `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/images/${category}?ref=${GITHUB_BRANCH}`;


            try {

                const response =
                    await fetch(
                        apiUrl,
                        {
                            headers: {
                                "Accept":
                                    "application/vnd.github+json"
                            },
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "GitHub klasörü okunamadı."
                    );

                }


                const files =
                    await response.json();


                const mediaFiles =
                    files
                        .filter(
                            file =>
                                file.type === "file"
                        )
                        .filter(file => {

                            const extension =
                                getExtension(
                                    file.name
                                );

                            return (
                                imageExtensions.includes(
                                    extension
                                ) ||
                                videoExtensions.includes(
                                    extension
                                )
                            );

                        })
                        .sort(
                            (a, b) =>
                                a.name.localeCompare(
                                    b.name,
                                    undefined,
                                    {
                                        numeric: true,
                                        sensitivity: "base"
                                    }
                                )
                        );


                gallery.innerHTML = "";


                if (mediaFiles.length === 0) {

                    gallery.innerHTML = `
                        <div class="empty">
                            Bu kategoride henüz çalışma bulunmuyor.
                        </div>
                    `;

                    return;

                }


                mediaFiles.forEach(file => {

                    const extension =
                        getExtension(
                            file.name
                        );


                    if (
                        imageExtensions.includes(
                            extension
                        )
                    ) {

                        createImage(file);

                    } else if (
                        videoExtensions.includes(
                            extension
                        )
                    ) {

                        createVideo(file);

                    }

                });

            }

            catch (error) {

                console.error(error);

                gallery.innerHTML = `
                    <div class="error">
                        Çalışmalar yüklenirken bir hata oluştu.
                        <br><br>
                        Lütfen birkaç saniye sonra tekrar deneyin.
                    </div>
                `;

            }

        }


        function getExtension(filename) {

            return filename
                .split(".")
                .pop()
                .toLowerCase();

        }


        function getRawUrl(path) {

            return `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${path}`;

        }


        function createImage(file) {

            const item =
                document.createElement("div");

            item.className =
                "gallery-item";


            const image =
                document.createElement("img");


            image.src =
                getRawUrl(file.path);

            image.alt =
                "";

            image.loading =
                "lazy";


            item.appendChild(image);


            item.addEventListener(
                "click",
                () => {

                    openLightbox(
                        image.src
                    );

                }
            );


            document
                .getElementById("gallery")
                .appendChild(item);

        }


        function createVideo(file) {

            const item =
                document.createElement("div");

            item.className =
                "gallery-item video-item";


            const player =
                document.createElement("div");

            player.className =
                "video-player";


            const video =
                document.createElement("video");


            /*
             * ÖNEMLİ:
             * GitHub API'nin verdiği download_url
             * doğrudan kullanılmaktadır.
             * Böylece dosya yolu yeniden oluşturulmaz.
             */

            const videoSource =
                document.createElement("source");

            videoSource.src =
                file.download_url ||
                getRawUrl(file.path);

            videoSource.type =
                "video/mp4";


            video.appendChild(
                videoSource
            );


            video.preload =
                "metadata";

            video.playsInline =
                true;

            video.controls =
                false;


            /*
             * VİDEO YÜKLENİNCE
             */

            video.addEventListener(
                "loadedmetadata",
                () => {

                    console.log(
                        "Video hazır:",
                        file.name,
                        video.duration
                    );

                }
            );


            /*
             * VİDEO HATASI
             */

            video.addEventListener(
                "error",
                () => {

                    console.error(
                        "Video oynatma hatası:",
                        file.name,
                        video.error
                    );

                    player.classList.add(
                        "video-error"
                    );

                }
            );


            /* BÜYÜK OYNATMA TUŞU */

            const playOverlay =
                document.createElement("button");

            playOverlay.type =
                "button";

            playOverlay.className =
                "video-play-overlay";

            playOverlay.setAttribute(
                "aria-label",
                "Videoyu oynat"
            );


            const playIcon =
                document.createElement("span");

            playIcon.className =
                "video-play-icon";


            playOverlay.appendChild(
                playIcon
            );


            /* VİDEO ETİKETİ */

            const label =
                document.createElement("div");

            label.className =
                "video-label";

            label.textContent =
                "Video";


            /* KONTROLLER */

            const controls =
                document.createElement("div");

            controls.className =
                "video-controls";


            const playButton =
                document.createElement("button");

            playButton.type =
                "button";

            playButton.className =
                "video-button";

            playButton.textContent =
                "▶";

            playButton.setAttribute(
                "aria-label",
                "Oynat / Duraklat"
            );


            const progress =
                document.createElement("input");

            progress.type =
                "range";

            progress.className =
                "video-progress";

            progress.min =
                "0";

            progress.max =
                "100";

            progress.value =
                "0";

            progress.step =
                "0.1";

            progress.setAttribute(
                "aria-label",
                "Video ilerlemesi"
            );


            const time =
                document.createElement("span");

            time.className =
                "video-time";

            time.textContent =
                "0:00 / 0:00";


            const muteButton =
                document.createElement("button");

            muteButton.type =
                "button";

            muteButton.className =
                "video-button";

            muteButton.textContent =
                "🔊";

            muteButton.setAttribute(
                "aria-label",
                "Sesi aç / kapat"
            );


            const fullscreenButton =
                document.createElement("button");

            fullscreenButton.type =
                "button";

            fullscreenButton.className =
                "video-button";

            fullscreenButton.textContent =
                "⛶";

            fullscreenButton.setAttribute(
                "aria-label",
                "Tam ekran"
            );


            controls.appendChild(
                playButton
            );

            controls.appendChild(
                progress
            );

            controls.appendChild(
                time
            );

            controls.appendChild(
                muteButton
            );

            controls.appendChild(
                fullscreenButton
            );


            player.appendChild(
                video
            );

            player.appendChild(
                playOverlay
            );

            player.appendChild(
                label
            );

            player.appendChild(
                controls
            );


            item.appendChild(
                player
            );


            /*
             * BÜYÜK OYNATMA TUŞU
             */

            playOverlay.addEventListener(
                "click",
                async event => {

                    event.stopPropagation();

                    await startVideo(
                        video,
                        player
                    );

                }
            );


            /*
             * OYNAT / DURAKLAT
             */

            playButton.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    toggleVideo(
                        video,
                        player
                    );

                }
            );


            /*
             * VİDEOYA TIKLAYINCA
             */

            video.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    toggleVideo(
                        video,
                        player
                    );

                }
            );


            /*
             * OYNATILDI
             */

            video.addEventListener(
                "play",
                () => {

                    playButton.textContent =
                        "❚❚";

                    player.classList.add(
                        "playing"
                    );

                }
            );


            /*
             * DURAKLATILDI
             */

            video.addEventListener(
                "pause",
                () => {

                    playButton.textContent =
                        "▶";

                    player.classList.remove(
                        "playing"
                    );

                }
            );


            /*
             * VİDEO BİTTİ
             */

            video.addEventListener(
                "ended",
                () => {

                    playButton.textContent =
                        "▶";

                    player.classList.remove(
                        "playing"
                    );

                }
            );


            /*
             * İLERLEME
             */

            video.addEventListener(
                "timeupdate",
                () => {

                    if (
                        Number.isFinite(
                            video.duration
                        ) &&
                        video.duration > 0
                    ) {

                        progress.value =
                            (
                                video.currentTime /
                                video.duration
                            ) * 100;

                    }


                    time.textContent =
                        formatTime(
                            video.currentTime
                        ) +
                        " / " +
                        formatTime(
                            video.duration
                        );

                }
            );


            /*
             * METADATA
             */

            video.addEventListener(
                "loadedmetadata",
                () => {

                    time.textContent =
                        "0:00 / " +
                        formatTime(
                            video.duration
                        );

                }
            );


            /*
             * İLERLEME ÇUBUĞU
             */

            progress.addEventListener(
                "input",
                event => {

                    event.stopPropagation();

                    if (
                        !Number.isFinite(
                            video.duration
                        )
                    ) {

                        return;

                    }


                    video.currentTime =
                        (
                            Number(
                                progress.value
                            ) / 100
                        ) *
                        video.duration;

                }
            );


            /*
             * SES
             */

            muteButton.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    video.muted =
                        !video.muted;

                    muteButton.textContent =
                        video.muted
                            ? "🔇"
                            : "🔊";

                }
            );


            /*
             * TAM EKRAN
             */

            fullscreenButton.addEventListener(
                "click",
                async event => {

                    event.stopPropagation();

                    try {

                        if (
                            document.fullscreenElement
                        ) {

                            await document.exitFullscreen();

                        }

                        else if (
                            player.requestFullscreen
                        ) {

                            await player.requestFullscreen();

                        }

                    }

                    catch (error) {

                        console.error(
                            "Tam ekran hatası:",
                            error
                        );

                    }

                }
            );


            /*
             * TAM EKRAN İKONU
             */

            document.addEventListener(
                "fullscreenchange",
                () => {

                    if (
                        document.fullscreenElement ===
                        player
                    ) {

                        fullscreenButton.textContent =
                            "×";

                    }

                    else {

                        fullscreenButton.textContent =
                            "⛶";

                    }

                }
            );


            /*
             * SAĞ TIK
             */

            video.addEventListener(
                "contextmenu",
                event => {

                    event.preventDefault();

                }
            );


            document
                .getElementById("gallery")
                .appendChild(item);

        }


        async function startVideo(
            video,
            player
        ) {

            try {

                /*
                 * Kaynağı yeniden yüklemeden önce
                 * tarayıcıya source'u kesin olarak tanıt.
                 */

                if (
                    video.readyState === 0
                ) {

                    video.load();

                }


                await video.play();

            }

            catch (error) {

                console.error(
                    "Video başlatılamadı:",
                    error
                );

                /*
                 * Bazı MP4'lerde metadata yüklenmesi
                 * gecikebildiği için ikinci deneme.
                 */

                setTimeout(
                    async () => {

                        try {

                            await video.play();

                        }

                        catch (secondError) {

                            console.error(
                                "İkinci video oynatma denemesi başarısız:",
                                secondError
                            );

                        }

                    },
                    300
                );

            }

        }


        async function toggleVideo(
            video,
            player
        ) {

            if (video.paused) {

                await startVideo(
                    video,
                    player
                );

            }

            else {

                video.pause();

            }

        }


        function formatTime(seconds) {

            if (
                !Number.isFinite(seconds) ||
                seconds < 0
            ) {

                return "0:00";

            }


            const minutes =
                Math.floor(
                    seconds / 60
                );


            const remainingSeconds =
                Math.floor(
                    seconds % 60
                );


            return (
                minutes +
                ":" +
                String(
                    remainingSeconds
                ).padStart(
                    2,
                    "0"
                )
            );

        }


        function openLightbox(src) {

            const lightbox =
                document.getElementById(
                    "lightbox"
                );

            const image =
                document.getElementById(
                    "lightboxImage"
                );


            image.src =
                src;

            image.alt =
                "";

            lightbox.classList.add(
                "active"
            );

            document.body.style.overflow =
                "hidden";

        }


        function closeLightbox() {

            const lightbox =
                document.getElementById(
                    "lightbox"
                );

            const image =
                document.getElementById(
                    "lightboxImage"
                );


            lightbox.classList.remove(
                "active"
            );

            image.src =
                "";

            document.body.style.overflow =
                "";

        }


        document
            .getElementById(
                "lightboxClose"
            )
            .addEventListener(
                "click",
                closeLightbox
            );


        document
            .getElementById(
                "lightbox"
            )
            .addEventListener(
                "click",
                event => {

                    if (
                        event.target.id ===
                        "lightbox"
                    ) {

                        closeLightbox();

                    }

                }
            );


        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    closeLightbox();

                }

            }
        );

    </script>
